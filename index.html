<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotionMirror — 실시간 모션 캡처</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --neon: #00ff88;
    --neon-dim: #00cc66;
    --bg: #0a0a1a;
    --panel: #12122a;
    --border: #1e1e4a;
    --text: #e0e0ff;
    --text-dim: #8080aa;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #header h1 { font-size: 1.2rem; font-weight: 700; color: var(--neon); letter-spacing: 2px; text-transform: uppercase; }
  #status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #555; transition: background 0.3s;
  }
  #status-dot.active {
    background: var(--neon); box-shadow: 0 0 8px var(--neon);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 4px var(--neon); } 50% { box-shadow: 0 0 14px var(--neon); } }
  #status-text { font-size: 0.8rem; color: var(--text-dim); }
  #fps-display { margin-left: auto; font-size: 0.75rem; color: var(--text-dim); font-family: monospace; }

  #main { display: flex; flex: 1; overflow: hidden; min-height: 0; }

  #webcam-panel {
    width: 30%; min-width: 220px; max-width: 380px;
    position: relative; background: #000;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #webcam-label {
    position: absolute; top: 8px; left: 8px;
    font-size: 0.7rem; color: var(--text-dim);
    background: rgba(0,0,0,0.6); padding: 2px 8px;
    border-radius: 4px; z-index: 2;
    letter-spacing: 1px; text-transform: uppercase;
  }
  #video-container { position: relative; flex: 1; overflow: hidden; }
  #input_video {
    position: absolute; width: 100%; height: 100%;
    object-fit: cover; opacity: 0.7; transform: scaleX(-1);
  }
  #overlay_canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; transform: scaleX(-1);
  }

  #threejs-panel { flex: 1; position: relative; background: var(--bg); overflow: hidden; }
  #threejs-panel canvas { display: block; width: 100% !important; height: 100% !important; }

  #model-loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; color: var(--text-dim);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  #toast {
    position: fixed; bottom: 70px; left: 50%;
    transform: translateX(-50%);
    background: #1a1a3a; border: 1px solid var(--neon);
    color: var(--text); padding: 8px 18px;
    border-radius: 8px; font-size: 0.78rem;
    white-space: pre-line; text-align: center;
    z-index: 100; opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }

  #drop-overlay {
    position: absolute; inset: 0;
    border: 3px dashed transparent;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 20;
    transition: border-color 0.2s, background 0.2s;
  }
  #drop-overlay.active {
    border-color: var(--neon);
    background: rgba(0,255,136,0.06);
  }
  #drop-msg {
    font-size: 1.4rem; color: var(--neon);
    font-weight: 700; letter-spacing: 1px;
    opacity: 0; transition: opacity 0.2s;
    text-shadow: 0 0 20px var(--neon);
  }
  #drop-overlay.active #drop-msg { opacity: 1; }

  #model-loading .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border); border-top-color: var(--neon);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #controls {
    display: flex; align-items: center; gap: 20px;
    padding: 10px 20px; background: var(--panel);
    border-top: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
  }
  .ctrl-group { display: flex; align-items: center; gap: 8px; }
  .ctrl-label { font-size: 0.75rem; color: var(--text-dim); white-space: nowrap; }
  input[type=range] {
    -webkit-appearance: none; width: 100px; height: 4px;
    background: var(--border); border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--neon);
    cursor: pointer; box-shadow: 0 0 6px var(--neon);
  }
  button.ctrl-btn {
    background: var(--border); color: var(--text);
    border: 1px solid var(--border); padding: 4px 12px;
    border-radius: 4px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
  }
  button.ctrl-btn:hover { background: var(--neon-dim); color: #000; border-color: var(--neon); }
  select.ctrl-select {
    background: var(--border); color: var(--text);
    border: 1px solid #2a2a5a; padding: 4px 8px;
    border-radius: 4px; font-size: 0.75rem; cursor: pointer; outline: none;
  }
  #webcam-btn { background: var(--neon-dim); color: #000; font-weight: 700; }
  #webcam-btn:hover { background: var(--neon); }
  .ctrl-val { font-size: 0.7rem; color: var(--neon); font-family: monospace; min-width: 28px; }

  #cam-message {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; color: var(--text-dim);
    font-size: 0.8rem; line-height: 1.6; z-index: 5;
  }
  #cam-message .icon { font-size: 2rem; margin-bottom: 8px; }
</style>
</head>
<body>

<div id="header">
  <h1>MotionMirror</h1>
  <div id="status-dot"></div>
  <span id="status-text">대기 중...</span>
  <span id="fps-display">-- fps</span>
</div>

<div id="main">
  <div id="webcam-panel">
    <div id="webcam-label">웹캠 뷰</div>
    <div id="video-container">
      <video id="input_video" autoplay muted playsinline></video>
      <canvas id="overlay_canvas"></canvas>
      <div id="cam-message">
        <div class="icon">📷</div>
        <div>웹캠 시작 버튼을 눌러주세요</div>
      </div>
    </div>
  </div>
  <div id="threejs-panel">
    <div id="toast"></div>
    <div id="drop-overlay">
      <div id="drop-msg">GLB 파일을 여기에 놓으세요</div>
    </div>
    <div id="model-loading">
      <div class="spinner"></div>
      <div id="loading-text">박스맨 준비 중...</div>
    </div>
  </div>
</div>

<!-- 숨겨진 파일 입력 -->
<input type="file" id="file-input" accept=".glb,.gltf" style="display:none" onchange="onFileSelected(this)">

<div id="controls">
  <div class="ctrl-group">
    <button class="ctrl-btn" id="webcam-btn" onclick="startWebcam()">▶ 웹캠 시작</button>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">스무딩</span>
    <input type="range" id="smoothing" min="0" max="0.95" step="0.05" value="0.65">
    <span class="ctrl-val" id="smoothing-val">0.65</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">캐릭터 크기</span>
    <input type="range" id="char-scale" min="0.05" max="5" step="0.05" value="1.5">
    <span class="ctrl-val" id="scale-val">1.5</span>
  </div>
  <div class="ctrl-group">
    <button class="ctrl-btn" onclick="document.getElementById('file-input').click()">📂 GLB 불러오기</button>
  </div>
  <div class="ctrl-group">
    <button class="ctrl-btn" onclick="buildFallbackCharacter()">박스맨</button>
  </div>
  <div class="ctrl-group">
    <button class="ctrl-btn" onclick="resetPose()">↺ 포즈 리셋</button>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">배경</span>
    <select class="ctrl-select" onchange="onBgChange(this.value)">
      <option value="dark">어둡게</option>
      <option value="light">밝게</option>
    </select>
  </div>
</div>

<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ─────────────────────────────────────────────
// 뼈대 이름 매핑 (런타임에 자동 갱신됨)
// ─────────────────────────────────────────────
let BONE_MAP = {
  hips:          'mixamorigHips',
  spine:         'mixamorigSpine',
  neck:          'mixamorigNeck',
  leftUpperArm:  'mixamorigLeftArm',
  leftLowerArm:  'mixamorigLeftForeArm',
  rightUpperArm: 'mixamorigRightArm',
  rightLowerArm: 'mixamorigRightForeArm',
  leftUpperLeg:  'mixamorigLeftUpLeg',
  leftLowerLeg:  'mixamorigLeftLeg',
  rightUpperLeg: 'mixamorigRightUpLeg',
  rightLowerLeg: 'mixamorigRightLeg',
};

// 뼈 이름 후보 목록 (Mixamo / 기타 익스포터 / VRM 등)
const BONE_CANDIDATES = {
  hips:          ['mixamorigHips','Hips','hips','pelvis','Pelvis','Hip','CC_Base_Hip'],
  spine:         ['mixamorigSpine','Spine','spine','Spine1','spine01','CC_Base_Spine01'],
  neck:          ['mixamorigNeck','Neck','neck','CC_Base_NeckTwist01'],
  leftUpperArm:  ['mixamorigLeftArm','LeftArm','Left_Arm','mixamorig:LeftArm','UpperArm_L','CC_Base_L_Upperarm'],
  leftLowerArm:  ['mixamorigLeftForeArm','LeftForeArm','Left_ForeArm','ForeArm_L','CC_Base_L_Forearm'],
  rightUpperArm: ['mixamorigRightArm','RightArm','Right_Arm','UpperArm_R','CC_Base_R_Upperarm'],
  rightLowerArm: ['mixamorigRightForeArm','RightForeArm','Right_ForeArm','ForeArm_R','CC_Base_R_Forearm'],
  leftUpperLeg:  ['mixamorigLeftUpLeg','LeftUpLeg','LeftThigh','Thigh_L','CC_Base_L_Thigh'],
  leftLowerLeg:  ['mixamorigLeftLeg','LeftLeg','LeftShin','Shin_L','CC_Base_L_Calf'],
  rightUpperLeg: ['mixamorigRightUpLeg','RightUpLeg','RightThigh','Thigh_R','CC_Base_R_Thigh'],
  rightLowerLeg: ['mixamorigRightLeg','RightLeg','RightShin','Shin_R','CC_Base_R_Calf'],
};

// 실제 뼈대 목록에서 BONE_MAP 자동 해석
function resolveBoneMap() {
  const allNames = Object.keys(bones);
  const resolved = {};

  for (const [key, candidates] of Object.entries(BONE_CANDIDATES)) {
    // 1) 정확한 이름 매칭
    for (const c of candidates) {
      if (bones[c]) { resolved[key] = c; break; }
    }
    // 2) 부분 문자열 매칭 (대소문자 무시)
    if (!resolved[key]) {
      for (const c of candidates) {
        const lo = c.toLowerCase();
        const match = allNames.find(n => n.toLowerCase() === lo || n.toLowerCase().endsWith(lo));
        if (match) { resolved[key] = match; break; }
      }
    }
  }

  const found = Object.keys(resolved).length;
  const total = Object.keys(BONE_CANDIDATES).length;
  console.log(`[MotionMirror] 뼈대 매핑: ${found}/${total}개 해결됨`, resolved);

  if (found === 0) {
    showToast(`⚠️ 뼈대를 찾지 못했습니다.\n모델 뼈 이름: ${allNames.slice(0,6).join(', ')}...`, 6000);
  } else if (found < total) {
    showToast(`✓ 뼈대 ${found}/${total}개 매핑됨 (일부 누락)`, 3000);
  } else {
    showToast(`✓ 뼈대 ${found}개 모두 매핑됨`, 2000);
  }

  return resolved;
}

// ─────────────────────────────────────────────
// 전역 상태
// ─────────────────────────────────────────────
let scene, camera, renderer, orbitControls, clock;
let character = null;
let bones = {};
let restData = {};   // boneName → { restQ, restDir }
let smoothing = 0.65;
let frameCount = 0, lastFpsTime = 0;
let poseDetector = null;

// ─────────────────────────────────────────────
// THREE.JS 씬 초기화
// ─────────────────────────────────────────────
function initThree() {
  const panel = document.getElementById('threejs-panel');

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setSize(panel.clientWidth, panel.clientHeight);
  panel.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.FogExp2(0x0a0a1a, 0.025);

  camera = new THREE.PerspectiveCamera(60, panel.clientWidth / panel.clientHeight, 0.1, 100);
  camera.position.set(0, 1.4, 3.5);
  camera.lookAt(0, 0.9, 0);

  orbitControls = new OrbitControls(camera, renderer.domElement);
  orbitControls.target.set(0, 0.9, 0);
  orbitControls.enableDamping = true;
  orbitControls.dampingFactor = 0.08;
  orbitControls.minDistance = 0.5;
  orbitControls.maxDistance = 50;
  orbitControls.update();

  // 조명
  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  const hemi = new THREE.HemisphereLight(0x8888ff, 0x222244, 0.5);
  scene.add(hemi);
  const dir1 = new THREE.DirectionalLight(0xffffff, 0.9);
  dir1.position.set(2, 4, 3);
  dir1.castShadow = true;
  dir1.shadow.mapSize.set(1024, 1024);
  dir1.shadow.camera.left = dir1.shadow.camera.bottom = -4;
  dir1.shadow.camera.right = dir1.shadow.camera.top = 4;
  scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0x6644ff, 0.3);
  dir2.position.set(-3, 2, -2);
  scene.add(dir2);

  // 바닥
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 20),
    new THREE.MeshStandardMaterial({ color: 0x050510, roughness: 0.9 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  const grid = new THREE.GridHelper(20, 40, 0x111133, 0x111133);
  grid.material.transparent = true;
  grid.material.opacity = 0.6;
  scene.add(grid);

  clock = new THREE.Clock();

  // 박스맨으로 바로 시작 (GLB는 드래그앤드롭 또는 파일 선택으로 로드)
  buildFallbackCharacter();

  // 렌더 루프
  (function loop() {
    requestAnimationFrame(loop);
    orbitControls.update();
    renderer.render(scene, camera);
    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime > 1000) {
      document.getElementById('fps-display').textContent = frameCount + ' fps';
      frameCount = 0;
      lastFpsTime = now;
    }
  })();

  window.addEventListener('resize', () => {
    camera.aspect = panel.clientWidth / panel.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(panel.clientWidth, panel.clientHeight);
  });
}

// ─────────────────────────────────────────────
// 토스트 메시지
// ─────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, ms = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// ─────────────────────────────────────────────
// GLTF 로더 (ArrayBuffer 방식 — 파일 시스템 불필요)
// ─────────────────────────────────────────────
const gltfLoader = new GLTFLoader();

function loadGLTFFromBuffer(arrayBuffer, fileName) {
  const loadingEl = document.getElementById('model-loading');
  document.getElementById('loading-text').textContent = fileName + ' 로드 중...';
  loadingEl.style.display = 'flex';

  gltfLoader.parse(arrayBuffer, '', (gltf) => {
    gltf.scene.traverse(obj => {
      if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; }
    });
    replaceCharacter(gltf.scene);
    loadingEl.style.display = 'none';
    console.log('[MotionMirror] 로드 완료. 오브젝트 수:', Object.keys(bones).length);
  }, (err) => {
    console.error('[MotionMirror] 파싱 실패:', err);
    showToast('⚠️ GLB 파싱 실패: ' + (err.message || err), 5000);
    loadingEl.style.display = 'none';
  });
}

// 파일 선택 버튼
window.onFileSelected = function(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => loadGLTFFromBuffer(e.target.result, file.name);
  reader.readAsArrayBuffer(file);
  input.value = ''; // 같은 파일 재선택 허용
};

// 드래그 앤 드롭
function initDragDrop() {
  const panel = document.getElementById('threejs-panel');
  const overlay = document.getElementById('drop-overlay');

  panel.addEventListener('dragover', e => {
    e.preventDefault();
    overlay.classList.add('active');
  });
  panel.addEventListener('dragleave', e => {
    if (!panel.contains(e.relatedTarget)) overlay.classList.remove('active');
  });
  panel.addEventListener('drop', e => {
    e.preventDefault();
    overlay.classList.remove('active');
    const file = e.dataTransfer.files[0];
    if (!file) return;
    if (!file.name.match(/\.(glb|gltf)$/i)) {
      showToast('⚠️ GLB 또는 GLTF 파일만 지원합니다', 3000);
      return;
    }
    const reader = new FileReader();
    reader.onload = ev => loadGLTFFromBuffer(ev.target.result, file.name);
    reader.readAsArrayBuffer(file);
  });
}

function replaceCharacter(newGroup) {
  if (character) scene.remove(character);
  bones = {};
  character = newGroup;
  const s = parseFloat(document.getElementById('char-scale').value);
  character.scale.setScalar(s);
  scene.add(character);
  character.updateMatrixWorld(true);

  // isBone 뿐 아니라 모든 named Object3D 수집 (GLB 익스포터마다 다름)
  character.traverse(obj => {
    if (obj.name) bones[obj.name] = obj;
  });

  // 실제 뼈 이름으로 BONE_MAP 동적 재해석
  BONE_MAP = resolveBoneMap();
  storeRestData();
}

// ─────────────────────────────────────────────
// 폴백 박스맨 생성
// ─────────────────────────────────────────────
function buildFallbackCharacter() {
  const mat  = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.5 });
  const matD = new THREE.MeshStandardMaterial({ color: 0x007744, roughness: 0.5 });

  function mkBone(name, px, py, pz) {
    const b = new THREE.Bone();
    b.name = name;
    b.position.set(px, py, pz);
    return b;
  }
  function addBox(bone, w, h, d, ox, oy, oz, m) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m || mat);
    mesh.position.set(ox, oy, oz);
    mesh.castShadow = true;
    bone.add(mesh);
  }

  // 뼈대 계층
  const hips    = mkBone('mixamorigHips',         0,    0.95, 0);
  const spine   = mkBone('mixamorigSpine',        0,    0.22, 0);
  const spine1  = mkBone('mixamorigSpine1',       0,    0.20, 0);
  const neck    = mkBone('mixamorigNeck',         0,    0.22, 0);
  const head    = mkBone('mixamorigHead',         0,    0.12, 0);

  const lSho   = mkBone('mixamorigLeftShoulder',  0.18, 0.18, 0);
  const lArm   = mkBone('mixamorigLeftArm',       0.15, 0,    0);
  const lFore  = mkBone('mixamorigLeftForeArm',   0.28, 0,    0);
  const lHand  = mkBone('mixamorigLeftHand',      0.24, 0,    0);

  const rSho   = mkBone('mixamorigRightShoulder',-0.18, 0.18, 0);
  const rArm   = mkBone('mixamorigRightArm',     -0.15, 0,    0);
  const rFore  = mkBone('mixamorigRightForeArm', -0.28, 0,    0);
  const rHand  = mkBone('mixamorigRightHand',    -0.24, 0,    0);

  const lUpLeg = mkBone('mixamorigLeftUpLeg',     0.10,-0.10, 0);
  const lLeg   = mkBone('mixamorigLeftLeg',       0,   -0.42, 0);
  const lFoot  = mkBone('mixamorigLeftFoot',      0,   -0.42, 0);

  const rUpLeg = mkBone('mixamorigRightUpLeg',   -0.10,-0.10, 0);
  const rLeg   = mkBone('mixamorigRightLeg',      0,   -0.42, 0);
  const rFoot  = mkBone('mixamorigRightFoot',     0,   -0.42, 0);

  // 계층 연결
  hips.add(spine);
  spine.add(spine1);
  spine1.add(neck, lSho, rSho);
  neck.add(head);
  lSho.add(lArm); lArm.add(lFore); lFore.add(lHand);
  rSho.add(rArm); rArm.add(rFore); rFore.add(rHand);
  hips.add(lUpLeg); lUpLeg.add(lLeg); lLeg.add(lFoot);
  hips.add(rUpLeg); rUpLeg.add(rLeg); rLeg.add(rFoot);

  // 시각 메시
  addBox(head,   0.22, 0.22, 0.22, 0,    0.11, 0);
  addBox(neck,   0.10, 0.12, 0.10, 0,    0.06, 0, matD);
  addBox(spine1, 0.36, 0.40, 0.18, 0,    0,    0, matD);
  addBox(hips,   0.32, 0.20, 0.18, 0,    0,    0, matD);
  addBox(lArm,   0.26, 0.10, 0.10, 0.13, 0,    0);
  addBox(lFore,  0.23, 0.09, 0.09, 0.11, 0,    0);
  addBox(lHand,  0.10, 0.14, 0.06, 0.05, 0,    0);
  addBox(rArm,   0.26, 0.10, 0.10,-0.13, 0,    0);
  addBox(rFore,  0.23, 0.09, 0.09,-0.11, 0,    0);
  addBox(rHand,  0.10, 0.14, 0.06,-0.05, 0,    0);
  addBox(lUpLeg, 0.14, 0.40, 0.14, 0,   -0.20, 0);
  addBox(lLeg,   0.12, 0.40, 0.12, 0,   -0.20, 0);
  addBox(lFoot,  0.12, 0.08, 0.22, 0,    0,    0.05, matD);
  addBox(rUpLeg, 0.14, 0.40, 0.14, 0,   -0.20, 0);
  addBox(rLeg,   0.12, 0.40, 0.12, 0,   -0.20, 0);
  addBox(rFoot,  0.12, 0.08, 0.22, 0,    0,    0.05, matD);

  const group = new THREE.Group();
  group.add(hips);
  replaceCharacter(group);
}

// ─────────────────────────────────────────────
// 레스트 포즈 저장
// ─────────────────────────────────────────────
function storeRestData() {
  restData = {};
  if (!character) return;
  character.updateMatrixWorld(true);

  for (const boneName of Object.values(BONE_MAP)) {
    const bone = bones[boneName];
    if (!bone) continue;

    // 자식 본의 로컬 위치로부터 이 본이 향하는 방향을 구함
    // child.position 은 이 bone의 로컬 공간 기준
    // bone.quaternion 을 적용하면 부모 로컬 공간에서의 방향이 됨
    const childBone = bone.children.find(c => c.isBone);
    let restDir = new THREE.Vector3(0, 1, 0); // 기본값

    if (childBone && childBone.position.lengthSq() > 1e-6) {
      restDir = childBone.position.clone()
        .applyQuaternion(bone.quaternion)
        .normalize();
    } else {
      // 자식 본 없음 → 이 본의 부모 기준 위치 방향 사용
      if (bone.position.lengthSq() > 1e-6) {
        restDir = bone.position.clone().normalize();
      }
    }

    restData[boneName] = {
      restQ:   bone.quaternion.clone(),
      restDir: restDir,
    };
  }
}

// ─────────────────────────────────────────────
// 본 방향 설정 (핵심 수정 함수)
// ─────────────────────────────────────────────
// worldDir: 이 본이 가리켜야 할 방향 (월드 공간)
function setBoneDir(boneName, worldDir) {
  const bone = bones[boneName];
  const data = restData[boneName];
  if (!bone || !data || worldDir.lengthSq() < 0.001) return;

  // 1. 부모 본의 월드 쿼터니언 획득
  const parentWorldQ = new THREE.Quaternion();
  if (bone.parent) bone.parent.getWorldQuaternion(parentWorldQ);

  // 2. 원하는 방향을 부모 로컬 공간으로 변환
  const localTarget = worldDir.clone()
    .applyQuaternion(parentWorldQ.clone().invert())
    .normalize();

  // 3. 레스트 방향 → 목표 방향 델타 쿼터니언 (부모 로컬 공간)
  const deltaQ = new THREE.Quaternion().setFromUnitVectors(data.restDir, localTarget);

  // 4. 최종 = delta * restQ
  //    (부모 로컬 공간에서 델타 회전을 레스트 포즈 위에 적용)
  const finalQ = deltaQ.clone().multiply(data.restQ);

  // 5. 스무딩 보간
  bone.quaternion.slerp(finalQ, 1.0 - smoothing);
}

// ─────────────────────────────────────────────
// 포즈 적용
// ─────────────────────────────────────────────
function applyPoseToModel(lms) {
  if (!character || !lms || Object.keys(restData).length === 0) return;

  // 월드 행렬 갱신 (부모 본 쿼터니언을 올바르게 읽기 위함)
  character.updateMatrixWorld(true);

  // visibility 체크 (world landmarks 는 visibility 없을 수 있음)
  const vis = i => (lms[i].visibility ?? 1) > 0.5;

  // MediaPipe 좌표 → Three.js 월드 벡터
  // poseLandmarks: x[0..1] 왼→오, y[0..1] 위→아래, z(상대 깊이)
  // - x: 미러(selfie) 뷰이므로 뒤집지 않음 (landmark 11=사람 왼쪽 = 화면 오른쪽 = 캐릭터 왼쪽 +X)
  // - y: 뒤집기 (화면 아래 = 월드 위쪽 반전)
  // - z: 깊이 보정
  const toV = i => new THREE.Vector3(
     (lms[i].x - 0.5),
    -(lms[i].y - 0.5),
    -(lms[i].z ?? 0) * 0.5
  );

  // 두 랜드마크 사이의 방향 벡터
  const segDir = (a, b) => toV(b).sub(toV(a)).normalize();

  // ── 힙 yaw (몸통 좌우 회전) ──
  // 어깨축과 힙축의 XZ 평면 방향으로 몸이 얼마나 돌아있는지 계산
  if (vis(11) && vis(12) && vis(23) && vis(24)) {
    const lSh = toV(11), rSh = toV(12);
    const lHp = toV(23), rHp = toV(24);

    // 좌어깨 - 우어깨 벡터 (XZ 투영) — 정면 시: +X 방향
    const shLat = new THREE.Vector3(lSh.x - rSh.x, 0, lSh.z - rSh.z);
    const hpLat = new THREE.Vector3(lHp.x - rHp.x, 0, lHp.z - rHp.z);

    // 두 벡터 평균으로 안정화
    const lat = shLat.add(hpLat).normalize();
    if (lat.lengthSq() > 0.01) {
      // 정면 기준(+X) 대비 회전각. 미러뷰이므로 부호 반전
      const yaw = -Math.atan2(lat.z, lat.x);

      const hipBone = bones[BONE_MAP.hips];
      if (hipBone) {
        const parentWorldQ = new THREE.Quaternion();
        if (hipBone.parent) hipBone.parent.getWorldQuaternion(parentWorldQ);
        // 월드 Y축을 부모 로컬로 변환 후 그 축으로 회전
        const localY = new THREE.Vector3(0, 1, 0).applyQuaternion(parentWorldQ.clone().invert()).normalize();
        const deltaQ  = new THREE.Quaternion().setFromAxisAngle(localY, yaw);
        const rd = restData[BONE_MAP.hips];
        const finalQ = deltaQ.clone().multiply(rd ? rd.restQ : new THREE.Quaternion());
        hipBone.quaternion.slerp(finalQ, 1.0 - smoothing);
      }
    }
  }

  // ── 척추 (기울기) ──
  if (vis(11) && vis(12) && vis(23) && vis(24)) {
    const shoulderMid = toV(11).add(toV(12)).multiplyScalar(0.5);
    const hipMid      = toV(23).add(toV(24)).multiplyScalar(0.5);
    setBoneDir(BONE_MAP.spine, shoulderMid.sub(hipMid));
  }

  // ── 목 ──
  if (vis(0) && vis(11) && vis(12)) {
    const shoulderMid = toV(11).add(toV(12)).multiplyScalar(0.5);
    setBoneDir(BONE_MAP.neck, toV(0).sub(shoulderMid));
  }

  // ── 팔 ──
  if (vis(11) && vis(13)) setBoneDir(BONE_MAP.leftUpperArm,  segDir(11, 13));
  if (vis(13) && vis(15)) setBoneDir(BONE_MAP.leftLowerArm,  segDir(13, 15));
  if (vis(12) && vis(14)) setBoneDir(BONE_MAP.rightUpperArm, segDir(12, 14));
  if (vis(14) && vis(16)) setBoneDir(BONE_MAP.rightLowerArm, segDir(14, 16));

  // ── 다리 ──
  if (vis(23) && vis(25)) setBoneDir(BONE_MAP.leftUpperLeg,  segDir(23, 25));
  if (vis(25) && vis(27)) setBoneDir(BONE_MAP.leftLowerLeg,  segDir(25, 27));
  if (vis(24) && vis(26)) setBoneDir(BONE_MAP.rightUpperLeg, segDir(24, 26));
  if (vis(26) && vis(28)) setBoneDir(BONE_MAP.rightLowerLeg, segDir(26, 28));
}

// ─────────────────────────────────────────────
// MediaPipe 초기화
// ─────────────────────────────────────────────
function loadMediaPipeScripts() {
  return new Promise((resolve, reject) => {
    const s1 = document.createElement('script');
    s1.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js';
    s1.onload = () => {
      const s2 = document.createElement('script');
      s2.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js';
      s2.onload = resolve;
      s2.onerror = reject;
      document.head.appendChild(s2);
    };
    s1.onerror = reject;
    document.head.appendChild(s1);
  });
}

async function startWebcam() {
  const btn = document.getElementById('webcam-btn');
  btn.disabled = true;
  btn.textContent = '초기화 중...';

  try {
    await loadMediaPipeScripts();
    const video = document.getElementById('input_video');

    poseDetector = new window.Pose({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}`
    });
    poseDetector.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });
    poseDetector.onResults(onPoseResults);

    const cam = new window.Camera(video, {
      onFrame: async () => { await poseDetector.send({ image: video }); },
      width: 640, height: 480,
    });
    await cam.start();

    document.getElementById('cam-message').style.display = 'none';
    btn.textContent = '■ 중지';
    btn.style.cssText = 'background:#cc0044;color:#fff;font-weight:700';
    btn.onclick = stopWebcam;
    btn.disabled = false;
    setStatus('연결됨...', false);

  } catch (e) {
    console.error(e);
    btn.disabled = false;
    btn.textContent = '▶ 웹캠 시작';
    btn.style.cssText = '';
    setStatus('오류: ' + e.message, false);
    document.getElementById('cam-message').innerHTML =
      `<div class="icon">⚠️</div><div>오류: ${e.message}</div>`;
  }
}
window.startWebcam = startWebcam;

function stopWebcam() {
  if (poseDetector) { poseDetector.close(); poseDetector = null; }
  const video = document.getElementById('input_video');
  if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  const btn = document.getElementById('webcam-btn');
  btn.textContent = '▶ 웹캠 시작';
  btn.style.cssText = '';
  btn.onclick = startWebcam;
  setStatus('중지됨', false);
  document.getElementById('cam-message').style.display = '';
  document.getElementById('cam-message').innerHTML =
    '<div class="icon">📷</div><div>웹캠 시작 버튼을 눌러주세요</div>';
}

// ─────────────────────────────────────────────
// 포즈 결과 처리
// ─────────────────────────────────────────────
function onPoseResults(results) {
  drawLandmarks(results);
  if (!results.poseLandmarks) { setStatus('포즈 감지 안됨', false); return; }
  setStatus('실시간 감지 중', true);
  // worldLandmarks 가 있으면 더 정확한 3D 좌표 사용
  applyPoseToModel(results.poseWorldLandmarks || results.poseLandmarks);
}

function setStatus(msg, active) {
  document.getElementById('status-text').textContent = msg;
  document.getElementById('status-dot').classList.toggle('active', active);
}

// ─────────────────────────────────────────────
// 웹캠 오버레이 스켈레톤 드로잉
// ─────────────────────────────────────────────
const SKEL_CONNECTIONS = [
  [11,12],[11,13],[13,15],[12,14],[14,16],
  [11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]
];
const KEY_JOINTS = [0,11,12,13,14,15,16,23,24,25,26,27,28];

function drawLandmarks(results) {
  const canvas = document.getElementById('overlay_canvas');
  const ctx = canvas.getContext('2d');
  const video = document.getElementById('input_video');
  canvas.width  = video.videoWidth  || canvas.offsetWidth;
  canvas.height = video.videoHeight || canvas.offsetHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!results.poseLandmarks) return;
  const lms = results.poseLandmarks;
  const W = canvas.width, H = canvas.height;

  ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2;
  for (const [a, b] of SKEL_CONNECTIONS) {
    if (lms[a].visibility < 0.3 || lms[b].visibility < 0.3) continue;
    ctx.beginPath();
    ctx.moveTo(lms[a].x * W, lms[a].y * H);
    ctx.lineTo(lms[b].x * W, lms[b].y * H);
    ctx.stroke();
  }
  for (const i of KEY_JOINTS) {
    if (lms[i].visibility < 0.3) continue;
    ctx.beginPath();
    ctx.arc(lms[i].x * W, lms[i].y * H, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#00ff88'; ctx.fill();
    ctx.strokeStyle = '#003322'; ctx.lineWidth = 1; ctx.stroke();
  }
}

// ─────────────────────────────────────────────
// UI 컨트롤
// ─────────────────────────────────────────────
document.getElementById('smoothing').addEventListener('input', function() {
  smoothing = parseFloat(this.value);
  document.getElementById('smoothing-val').textContent = smoothing.toFixed(2);
});

document.getElementById('char-scale').addEventListener('input', function() {
  const s = parseFloat(this.value);
  document.getElementById('scale-val').textContent = s.toFixed(1);
  if (character) character.scale.setScalar(s);
});

window.onBgChange = val => {
  const c = val === 'light' ? 0xdde8ff : 0x0a0a1a;
  scene.background = new THREE.Color(c);
  scene.fog = new THREE.FogExp2(c, 0.025);
};

window.resetPose = () => {
  for (const data of Object.values(restData)) {
    // 이미 restQ 가 저장돼 있으므로 각 bone을 restQ로 복원
  }
  for (const [name, bone] of Object.entries(bones)) {
    if (restData[name]) bone.quaternion.copy(restData[name].restQ);
  }
};

// ─────────────────────────────────────────────
// 시작
// ─────────────────────────────────────────────
initThree();
initDragDrop();
