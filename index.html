<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotionMirror — 실시간 모션 캡처</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --neon: #00ff88;
    --neon-dim: #00cc66;
    --bg: #0a0a1a;
    --bg2: #0f0f2a;
    --panel: #12122a;
    --border: #1e1e4a;
    --text: #e0e0ff;
    --text-dim: #8080aa;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  #header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }
  #header h1 {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--neon);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #555;
    transition: background 0.3s;
    box-shadow: 0 0 0px transparent;
  }
  #status-dot.active {
    background: var(--neon);
    box-shadow: 0 0 8px var(--neon);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 4px var(--neon); }
    50% { box-shadow: 0 0 14px var(--neon); }
  }
  #status-text {
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  #fps-display {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--text-dim);
    font-family: monospace;
  }

  /* MAIN AREA */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* WEBCAM PANEL */
  #webcam-panel {
    width: 30%;
    min-width: 220px;
    max-width: 380px;
    position: relative;
    background: #000;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  #webcam-label {
    position: absolute;
    top: 8px; left: 8px;
    font-size: 0.7rem;
    color: var(--text-dim);
    background: rgba(0,0,0,0.6);
    padding: 2px 8px;
    border-radius: 4px;
    z-index: 2;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #video-container {
    position: relative;
    flex: 1;
    overflow: hidden;
  }
  #input_video {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0.7;
    transform: scaleX(-1);
  }
  #overlay_canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform: scaleX(-1);
  }

  /* 3D PANEL */
  #threejs-panel {
    flex: 1;
    position: relative;
    background: var(--bg);
    overflow: hidden;
  }
  #threejs-panel canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }
  #model-loading {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--text-dim);
  }
  #model-loading .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--neon);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* CONTROLS */
  #controls {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 10px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ctrl-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    white-space: nowrap;
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 100px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--neon);
    cursor: pointer;
    box-shadow: 0 0 6px var(--neon);
  }
  button.ctrl-btn {
    background: var(--border);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  button.ctrl-btn:hover {
    background: var(--neon-dim);
    color: #000;
    border-color: var(--neon);
  }
  select.ctrl-select {
    background: var(--border);
    color: var(--text);
    border: 1px solid #2a2a5a;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
    outline: none;
  }
  #webcam-btn {
    background: var(--neon-dim);
    color: #000;
    font-weight: 700;
  }
  #webcam-btn:hover {
    background: var(--neon);
  }
  .ctrl-val {
    font-size: 0.7rem;
    color: var(--neon);
    font-family: monospace;
    min-width: 28px;
  }

  /* OVERLAY MESSAGES */
  #cam-message {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
    line-height: 1.6;
    pointer-events: none;
    z-index: 5;
  }
  #cam-message .icon { font-size: 2rem; margin-bottom: 8px; }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <h1>MotionMirror</h1>
  <div id="status-dot"></div>
  <span id="status-text">대기 중...</span>
  <span id="fps-display">-- fps</span>
</div>

<!-- MAIN -->
<div id="main">

  <!-- WEBCAM PANEL -->
  <div id="webcam-panel">
    <div id="webcam-label">웹캠 뷰</div>
    <div id="video-container">
      <video id="input_video" autoplay muted playsinline></video>
      <canvas id="overlay_canvas"></canvas>
      <div id="cam-message">
        <div class="icon">📷</div>
        <div>웹캠 시작 버튼을 눌러주세요</div>
      </div>
    </div>
  </div>

  <!-- 3D PANEL -->
  <div id="threejs-panel">
    <div id="model-loading">
      <div class="spinner"></div>
      <div>3D 씬 초기화 중...</div>
    </div>
  </div>
</div>

<!-- CONTROLS -->
<div id="controls">
  <div class="ctrl-group">
    <button class="ctrl-btn" id="webcam-btn" onclick="startWebcam()">▶ 웹캠 시작</button>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">스무딩</span>
    <input type="range" id="smoothing" min="0" max="0.95" step="0.05" value="0.7">
    <span class="ctrl-val" id="smoothing-val">0.7</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">캐릭터 크기</span>
    <input type="range" id="char-scale" min="0.5" max="3" step="0.1" value="1.5">
    <span class="ctrl-val" id="scale-val">1.5</span>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">모델</span>
    <select class="ctrl-select" id="model-select" onchange="onModelChange(this.value)">
      <option value="fallback">박스맨 (기본)</option>
      <option value="custom">character.glb</option>
    </select>
  </div>
  <div class="ctrl-group">
    <button class="ctrl-btn" onclick="resetPose()">↺ 포즈 리셋</button>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">배경</span>
    <select class="ctrl-select" id="bg-select" onchange="onBgChange(this.value)">
      <option value="dark">어둡게</option>
      <option value="light">밝게</option>
    </select>
  </div>
</div>

<!-- THREE.JS & MEDIAPIPE CDN -->
<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ─────────────────────────────────────────────
// BONE MAP (Mixamo → MediaPipe segment)
// ─────────────────────────────────────────────
const BONE_MAP = {
  leftUpperArm:  'mixamorigLeftArm',
  leftLowerArm:  'mixamorigLeftForeArm',
  rightUpperArm: 'mixamorigRightArm',
  rightLowerArm: 'mixamorigRightForeArm',
  leftUpperLeg:  'mixamorigLeftUpLeg',
  leftLowerLeg:  'mixamorigLeftLeg',
  rightUpperLeg: 'mixamorigRightUpLeg',
  rightLowerLeg: 'mixamorigRightLeg',
  spine:         'mixamorigSpine',
  neck:          'mixamorigNeck',
  hips:          'mixamorigHips',
};

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let scene, camera, renderer, controls, clock;
let character = null;      // THREE.Group with .bones map
let bones = {};            // name → THREE.Bone
let smoothing = 0.7;
let lastLandmarks = null;
let animFrameId = null;
let poseDetector = null;
let webcamRunning = false;
let frameCount = 0, lastFpsTime = 0;

// ─────────────────────────────────────────────
// THREE.JS INIT
// ─────────────────────────────────────────────
function initThree() {
  const panel = document.getElementById('threejs-panel');

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setSize(panel.clientWidth, panel.clientHeight);
  panel.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.FogExp2(0x0a0a1a, 0.03);

  camera = new THREE.PerspectiveCamera(60, panel.clientWidth / panel.clientHeight, 0.1, 100);
  camera.position.set(0, 1.5, 4);
  camera.lookAt(0, 1, 0);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.5;
  controls.maxDistance = 12;
  controls.update();

  // Lighting
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);

  const hemi = new THREE.HemisphereLight(0x8888ff, 0x222244, 0.6);
  scene.add(hemi);

  const dir1 = new THREE.DirectionalLight(0xffffff, 0.8);
  dir1.position.set(2, 4, 3);
  dir1.castShadow = true;
  dir1.shadow.mapSize.set(1024, 1024);
  dir1.shadow.camera.near = 0.5;
  dir1.shadow.camera.far = 20;
  dir1.shadow.camera.left = dir1.shadow.camera.bottom = -4;
  dir1.shadow.camera.right = dir1.shadow.camera.top = 4;
  scene.add(dir1);

  const dir2 = new THREE.DirectionalLight(0x6644ff, 0.3);
  dir2.position.set(-3, 2, -2);
  scene.add(dir2);

  // Floor
  const floorGeo = new THREE.PlaneGeometry(20, 20);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x050510, roughness: 0.9 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const grid = new THREE.GridHelper(20, 40, 0x111133, 0x111133);
  grid.material.transparent = true;
  grid.material.opacity = 0.6;
  scene.add(grid);

  clock = new THREE.Clock();

  // Load fallback by default
  buildFallbackCharacter();
  hideLoading();

  startRenderLoop();

  window.addEventListener('resize', onResize);
}

function hideLoading() {
  const el = document.getElementById('model-loading');
  if (el) el.style.display = 'none';
}

function onResize() {
  const panel = document.getElementById('threejs-panel');
  camera.aspect = panel.clientWidth / panel.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(panel.clientWidth, panel.clientHeight);
}

function startRenderLoop() {
  function loop() {
    animFrameId = requestAnimationFrame(loop);
    const delta = clock.getDelta();
    controls.update();
    renderer.render(scene, camera);

    // FPS counter
    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime > 1000) {
      document.getElementById('fps-display').textContent = frameCount + ' fps';
      frameCount = 0;
      lastFpsTime = now;
    }
  }
  loop();
}

// ─────────────────────────────────────────────
// FALLBACK BOX MAN
// ─────────────────────────────────────────────
function buildFallbackCharacter() {
  if (character) scene.remove(character);
  bones = {};
  character = new THREE.Group();

  const mat = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.5, metalness: 0.1 });
  const matDark = new THREE.MeshStandardMaterial({ color: 0x008844, roughness: 0.5 });

  // Helper: make a box mesh
  function box(w, h, d, m) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m || mat);
    mesh.castShadow = true;
    return mesh;
  }

  // We build a bone hierarchy with SkinnedMesh for each segment
  // Actually, for simplicity, build with plain Object3D hierarchy
  // and manually control via .rotation

  // Root bone (hips)
  const rootBone = new THREE.Bone();
  rootBone.name = 'mixamorigHips';
  rootBone.position.set(0, 0.95, 0);

  // Spine
  const spineBone = new THREE.Bone();
  spineBone.name = 'mixamorigSpine';
  spineBone.position.set(0, 0.22, 0);
  rootBone.add(spineBone);

  // Spine1 (upper chest)
  const spine1Bone = new THREE.Bone();
  spine1Bone.name = 'mixamorigSpine1';
  spine1Bone.position.set(0, 0.2, 0);
  spineBone.add(spine1Bone);

  // Neck
  const neckBone = new THREE.Bone();
  neckBone.name = 'mixamorigNeck';
  neckBone.position.set(0, 0.22, 0);
  spine1Bone.add(neckBone);

  // Head
  const headBone = new THREE.Bone();
  headBone.name = 'mixamorigHead';
  headBone.position.set(0, 0.12, 0);
  neckBone.add(headBone);

  // Left shoulder
  const lShoulderBone = new THREE.Bone();
  lShoulderBone.name = 'mixamorigLeftShoulder';
  lShoulderBone.position.set(0.18, 0.18, 0);
  spine1Bone.add(lShoulderBone);

  // Left upper arm
  const lArmBone = new THREE.Bone();
  lArmBone.name = 'mixamorigLeftArm';
  lArmBone.position.set(0.15, 0, 0);
  lShoulderBone.add(lArmBone);

  // Left forearm
  const lForeArmBone = new THREE.Bone();
  lForeArmBone.name = 'mixamorigLeftForeArm';
  lForeArmBone.position.set(0.28, 0, 0);
  lArmBone.add(lForeArmBone);

  // Left hand
  const lHandBone = new THREE.Bone();
  lHandBone.name = 'mixamorigLeftHand';
  lHandBone.position.set(0.25, 0, 0);
  lForeArmBone.add(lHandBone);

  // Right shoulder
  const rShoulderBone = new THREE.Bone();
  rShoulderBone.name = 'mixamorigRightShoulder';
  rShoulderBone.position.set(-0.18, 0.18, 0);
  spine1Bone.add(rShoulderBone);

  // Right upper arm
  const rArmBone = new THREE.Bone();
  rArmBone.name = 'mixamorigRightArm';
  rArmBone.position.set(-0.15, 0, 0);
  rShoulderBone.add(rArmBone);

  // Right forearm
  const rForeArmBone = new THREE.Bone();
  rForeArmBone.name = 'mixamorigRightForeArm';
  rForeArmBone.position.set(-0.28, 0, 0);
  rArmBone.add(rForeArmBone);

  // Right hand
  const rHandBone = new THREE.Bone();
  rHandBone.name = 'mixamorigRightHand';
  rHandBone.position.set(-0.25, 0, 0);
  rForeArmBone.add(rHandBone);

  // Left hip
  const lUpLegBone = new THREE.Bone();
  lUpLegBone.name = 'mixamorigLeftUpLeg';
  lUpLegBone.position.set(0.1, -0.1, 0);
  rootBone.add(lUpLegBone);

  // Left knee
  const lLegBone = new THREE.Bone();
  lLegBone.name = 'mixamorigLeftLeg';
  lLegBone.position.set(0, -0.42, 0);
  lUpLegBone.add(lLegBone);

  // Left ankle
  const lFootBone = new THREE.Bone();
  lFootBone.name = 'mixamorigLeftFoot';
  lFootBone.position.set(0, -0.42, 0);
  lLegBone.add(lFootBone);

  // Right hip
  const rUpLegBone = new THREE.Bone();
  rUpLegBone.name = 'mixamorigRightUpLeg';
  rUpLegBone.position.set(-0.1, -0.1, 0);
  rootBone.add(rUpLegBone);

  // Right knee
  const rLegBone = new THREE.Bone();
  rLegBone.name = 'mixamorigRightLeg';
  rLegBone.position.set(0, -0.42, 0);
  rUpLegBone.add(rLegBone);

  // Right ankle
  const rFootBone = new THREE.Bone();
  rFootBone.name = 'mixamorigRightFoot';
  rFootBone.position.set(0, -0.42, 0);
  rLegBone.add(rFootBone);

  // Build skeleton
  const skeleton = new THREE.Skeleton([
    rootBone, spineBone, spine1Bone, neckBone, headBone,
    lShoulderBone, lArmBone, lForeArmBone, lHandBone,
    rShoulderBone, rArmBone, rForeArmBone, rHandBone,
    lUpLegBone, lLegBone, lFootBone,
    rUpLegBone, rLegBone, rFootBone,
  ]);

  // Build visual geometry on each bone using a helper group
  function addBoxOnBone(bone, w, h, d, offsetY, m) {
    const mesh = box(w, h, d, m);
    mesh.position.y = offsetY;
    mesh.castShadow = true;
    bone.add(mesh);
  }

  // Head
  addBoxOnBone(headBone, 0.22, 0.22, 0.22, 0.11, mat);
  // Neck
  addBoxOnBone(neckBone, 0.1, 0.12, 0.1, 0.06, matDark);
  // Torso (on spine1)
  addBoxOnBone(spine1Bone, 0.36, 0.40, 0.18, 0.0, matDark);
  // Hips/pelvis
  addBoxOnBone(rootBone, 0.32, 0.20, 0.18, 0.0, matDark);

  // Arms
  addBoxOnBone(lArmBone, 0.26, 0.1, 0.1, 0, mat);
  addBoxOnBone(lForeArmBone, 0.23, 0.09, 0.09, 0, mat);
  addBoxOnBone(lHandBone, 0.1, 0.14, 0.06, 0, mat);
  addBoxOnBone(rArmBone, 0.26, 0.1, 0.1, 0, mat);
  addBoxOnBone(rForeArmBone, 0.23, 0.09, 0.09, 0, mat);
  addBoxOnBone(rHandBone, 0.1, 0.14, 0.06, 0, mat);

  // Legs
  addBoxOnBone(lUpLegBone, 0.14, 0.40, 0.14, -0.20, mat);
  addBoxOnBone(lLegBone, 0.12, 0.40, 0.12, -0.20, mat);
  addBoxOnBone(lFootBone, 0.12, 0.08, 0.22, 0, matDark);
  addBoxOnBone(rUpLegBone, 0.14, 0.40, 0.14, -0.20, mat);
  addBoxOnBone(rLegBone, 0.12, 0.40, 0.12, -0.20, mat);
  addBoxOnBone(rFootBone, 0.12, 0.08, 0.22, 0, matDark);

  character.add(rootBone);
  scene.add(character);

  // Index bones by name
  collectBones(rootBone);

  const scale = parseFloat(document.getElementById('char-scale').value);
  character.scale.setScalar(scale);
}

function collectBones(bone) {
  bones[bone.name] = bone;
  for (const child of bone.children) {
    if (child.isBone) collectBones(child);
  }
}

function collectBonesFromMesh(root) {
  bones = {};
  root.traverse(obj => {
    if (obj.isBone) bones[obj.name] = obj;
  });
}

// ─────────────────────────────────────────────
// GLTF LOADER
// ─────────────────────────────────────────────
const loader = new GLTFLoader();

function loadGLTFCharacter(url) {
  document.getElementById('model-loading').style.display = 'flex';
  document.getElementById('model-loading').style.flexDirection = 'column';
  document.getElementById('model-loading').style.alignItems = 'center';

  loader.load(url, (gltf) => {
    if (character) scene.remove(character);
    bones = {};
    character = gltf.scene;
    character.traverse(obj => {
      if (obj.isMesh) {
        obj.castShadow = true;
        obj.receiveShadow = true;
      }
    });
    const scale = parseFloat(document.getElementById('char-scale').value);
    character.scale.setScalar(scale);
    scene.add(character);
    collectBonesFromMesh(character);
    hideLoading();
    console.log('GLTF loaded. Bones:', Object.keys(bones));
  }, undefined, (err) => {
    console.warn('GLTF load failed, using fallback:', err);
    buildFallbackCharacter();
    hideLoading();
    document.getElementById('model-select').value = 'fallback';
  });
}

// ─────────────────────────────────────────────
// MEDIAPIPE POSE
// ─────────────────────────────────────────────
async function initPose() {
  // Load MediaPipe via CDN
  return new Promise((resolve, reject) => {
    const script1 = document.createElement('script');
    script1.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js';
    script1.onload = () => {
      const script2 = document.createElement('script');
      script2.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js';
      script2.onload = () => resolve();
      script2.onerror = reject;
      document.head.appendChild(script2);
    };
    script1.onerror = reject;
    document.head.appendChild(script1);
  });
}

async function startWebcam() {
  const btn = document.getElementById('webcam-btn');
  btn.disabled = true;
  btn.textContent = '초기화 중...';

  try {
    await initPose();
    const video = document.getElementById('input_video');

    poseDetector = new window.Pose({
      locateFile: (file) =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${file}`
    });

    poseDetector.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      smoothSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });

    poseDetector.onResults(onPoseResults);

    const cameraUtil = new window.Camera(video, {
      onFrame: async () => {
        await poseDetector.send({ image: video });
      },
      width: 640,
      height: 480,
    });

    await cameraUtil.start();
    webcamRunning = true;

    document.getElementById('cam-message').style.display = 'none';
    btn.textContent = '● 감지 중';
    btn.style.background = '#cc0044';
    btn.style.color = '#fff';
    btn.onclick = stopWebcam;
    btn.disabled = false;
    setStatus('연결됨...', false);

  } catch (e) {
    console.error('Webcam/Pose init failed:', e);
    btn.disabled = false;
    btn.textContent = '▶ 웹캠 시작';
    setStatus('오류: ' + e.message, false);
    document.getElementById('cam-message').innerHTML =
      '<div class="icon">⚠️</div><div>웹캠 오류: ' + e.message + '</div>';
  }
}

// Expose to onclick
window.startWebcam = startWebcam;

function stopWebcam() {
  webcamRunning = false;
  if (poseDetector) { poseDetector.close(); poseDetector = null; }
  const video = document.getElementById('input_video');
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  const btn = document.getElementById('webcam-btn');
  btn.textContent = '▶ 웹캠 시작';
  btn.style.background = '';
  btn.style.color = '';
  btn.onclick = startWebcam;
  setStatus('중지됨', false);
  document.getElementById('status-dot').classList.remove('active');
  document.getElementById('cam-message').style.display = '';
  document.getElementById('cam-message').innerHTML =
    '<div class="icon">📷</div><div>웹캠 시작 버튼을 눌러주세요</div>';
}

function setStatus(msg, active) {
  document.getElementById('status-text').textContent = msg;
  const dot = document.getElementById('status-dot');
  if (active) dot.classList.add('active');
  else dot.classList.remove('active');
}

// ─────────────────────────────────────────────
// POSE RESULTS
// ─────────────────────────────────────────────
function onPoseResults(results) {
  drawLandmarks(results);

  if (!results.poseLandmarks) {
    setStatus('포즈 감지 안됨', false);
    return;
  }

  setStatus('실시간 감지 중', true);
  lastLandmarks = results.poseLandmarks;
  applyPoseToModel(results.poseLandmarks);
}

// ─────────────────────────────────────────────
// DRAW LANDMARKS ON CANVAS
// ─────────────────────────────────────────────
const CONNECTIONS = [
  [11,12],[11,13],[13,15],[12,14],[14,16],
  [11,23],[12,24],[23,24],[23,25],[25,27],
  [24,26],[26,28]
];

function drawLandmarks(results) {
  const canvas = document.getElementById('overlay_canvas');
  const ctx = canvas.getContext('2d');
  const video = document.getElementById('input_video');

  canvas.width = video.videoWidth || canvas.offsetWidth;
  canvas.height = video.videoHeight || canvas.offsetHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!results.poseLandmarks) return;
  const lms = results.poseLandmarks;
  const W = canvas.width, H = canvas.height;

  // Draw connections
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 2;
  for (const [a, b] of CONNECTIONS) {
    const la = lms[a], lb = lms[b];
    if (la.visibility < 0.3 || lb.visibility < 0.3) continue;
    ctx.beginPath();
    ctx.moveTo(la.x * W, la.y * H);
    ctx.lineTo(lb.x * W, lb.y * H);
    ctx.stroke();
  }

  // Draw joints
  const KEY_IDX = [0,11,12,13,14,15,16,23,24,25,26,27,28];
  for (const i of KEY_IDX) {
    const lm = lms[i];
    if (lm.visibility < 0.3) continue;
    ctx.beginPath();
    ctx.arc(lm.x * W, lm.y * H, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#00ff88';
    ctx.fill();
    ctx.strokeStyle = '#003322';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// ─────────────────────────────────────────────
// COORDINATE TRANSFORM & POSE APPLICATION
// ─────────────────────────────────────────────
const _v3 = new THREE.Vector3();
const _q = new THREE.Quaternion();
const _up = new THREE.Vector3(0, 1, 0);

// Convert MediaPipe landmark to THREE.Vector3
// MediaPipe: x=0..1 left→right, y=0..1 top→bottom, z depth
function lmToVec3(lm) {
  // Flip x (mirror), flip y (up direction)
  return new THREE.Vector3(-(lm.x - 0.5) * 2, -(lm.y - 0.5) * 2, -lm.z * 2);
}

function getVec(lms, i) { return lmToVec3(lms[i]); }

// Rotate a bone so its local "direction axis" points toward targetVec
function rotateBoneToward(boneName, targetDir, localAxis, parentWorldQuat) {
  const bone = bones[boneName];
  if (!bone) return;

  const worldDir = targetDir.clone().normalize();

  // Get bone's parent world quaternion
  const parentQ = parentWorldQuat || new THREE.Quaternion();
  // Local axis in world space (current)
  const localAxisWorld = localAxis.clone().applyQuaternion(parentQ).normalize();

  // Quaternion to rotate from localAxisWorld to worldDir
  const q = new THREE.Quaternion().setFromUnitVectors(localAxisWorld, worldDir);

  // Convert to bone local rotation
  const localQ = parentQ.clone().invert().multiply(q).multiply(parentQ);

  // Smooth
  bone.quaternion.slerp(localQ, 1 - smoothing);
}

// Compute parent world quaternion by walking up the bone chain
function getWorldQuat(bone) {
  const q = new THREE.Quaternion();
  let b = bone.parent;
  while (b && b.isBone) {
    q.premultiply(b.quaternion);
    b = b.parent;
  }
  return q;
}

const LIMB_CONFIGS = [
  // [ boneName, startLmIdx, endLmIdx, localAxis ]
  // Arms - MediaPipe: left side = our left (already mirrored above)
  { bone: BONE_MAP.leftUpperArm,  from: 11, to: 13, axis: new THREE.Vector3(1,0,0) },
  { bone: BONE_MAP.leftLowerArm,  from: 13, to: 15, axis: new THREE.Vector3(1,0,0) },
  { bone: BONE_MAP.rightUpperArm, from: 12, to: 14, axis: new THREE.Vector3(-1,0,0) },
  { bone: BONE_MAP.rightLowerArm, from: 14, to: 16, axis: new THREE.Vector3(-1,0,0) },
  // Legs
  { bone: BONE_MAP.leftUpperLeg,  from: 23, to: 25, axis: new THREE.Vector3(0,-1,0) },
  { bone: BONE_MAP.leftLowerLeg,  from: 25, to: 27, axis: new THREE.Vector3(0,-1,0) },
  { bone: BONE_MAP.rightUpperLeg, from: 24, to: 26, axis: new THREE.Vector3(0,-1,0) },
  { bone: BONE_MAP.rightLowerLeg, from: 26, to: 28, axis: new THREE.Vector3(0,-1,0) },
];

function applyPoseToModel(lms) {
  if (!bones || !lms) return;

  // Check visibility helper
  function vis(i) { return lms[i].visibility > 0.5; }

  // ── Spine / torso lean ──
  if (vis(11) && vis(12) && vis(23) && vis(24)) {
    const shoulderMid = getVec(lms, 11).add(getVec(lms, 12)).multiplyScalar(0.5);
    const hipMid = getVec(lms, 23).add(getVec(lms, 24)).multiplyScalar(0.5);
    const spineDir = shoulderMid.sub(hipMid).normalize();

    const spineBone = bones[BONE_MAP.spine];
    if (spineBone) {
      const targetQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), spineDir);
      spineBone.quaternion.slerp(targetQ, 1 - smoothing);
    }
  }

  // ── Neck / head ──
  if (vis(0) && vis(11) && vis(12)) {
    const shoulderMid = getVec(lms, 11).add(getVec(lms, 12)).multiplyScalar(0.5);
    const nosePos = getVec(lms, 0);
    const neckDir = nosePos.sub(shoulderMid).normalize();

    const neckBone = bones[BONE_MAP.neck];
    if (neckBone) {
      const targetQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), neckDir);
      neckBone.quaternion.slerp(targetQ, 1 - smoothing);
    }
  }

  // ── Hip rotation (twist) ──
  if (vis(23) && vis(24)) {
    const lHip = getVec(lms, 23);
    const rHip = getVec(lms, 24);
    const hipAxis = lHip.clone().sub(rHip).normalize();
    // Only apply yaw rotation to hips
    const hipBone = bones[BONE_MAP.hips];
    if (hipBone) {
      const angle = Math.atan2(hipAxis.z, hipAxis.x) - Math.atan2(0, 1);
      const targetQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), angle);
      hipBone.quaternion.slerp(targetQ, 1 - smoothing);
    }
  }

  // ── Limbs ──
  for (const cfg of LIMB_CONFIGS) {
    const fromLm = lms[cfg.from];
    const toLm = lms[cfg.to];
    if (fromLm.visibility < 0.5 || toLm.visibility < 0.5) continue;

    const fromV = getVec(lms, cfg.from);
    const toV = getVec(lms, cfg.to);
    const limbDir = toV.sub(fromV).normalize();

    const bone = bones[cfg.bone];
    if (!bone) continue;

    const targetQ = new THREE.Quaternion().setFromUnitVectors(cfg.axis.clone().normalize(), limbDir);
    bone.quaternion.slerp(targetQ, 1 - smoothing);
  }
}

// ─────────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────────
document.getElementById('smoothing').addEventListener('input', function() {
  smoothing = parseFloat(this.value);
  document.getElementById('smoothing-val').textContent = smoothing.toFixed(2);
});

document.getElementById('char-scale').addEventListener('input', function() {
  const s = parseFloat(this.value);
  document.getElementById('scale-val').textContent = s.toFixed(1);
  if (character) character.scale.setScalar(s);
});

window.onModelChange = function(val) {
  if (val === 'custom') {
    loadGLTFCharacter('./models/character.glb');
  } else {
    buildFallbackCharacter();
  }
};

window.onBgChange = function(val) {
  if (val === 'light') {
    scene.background = new THREE.Color(0xdde8ff);
    scene.fog = new THREE.FogExp2(0xdde8ff, 0.02);
  } else {
    scene.background = new THREE.Color(0x0a0a1a);
    scene.fog = new THREE.FogExp2(0x0a0a1a, 0.03);
  }
};

window.resetPose = function() {
  for (const bone of Object.values(bones)) {
    bone.quaternion.set(0, 0, 0, 1);
  }
};

initThree();
